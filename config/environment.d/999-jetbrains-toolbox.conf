# Named 999-* so it runs after 99-environment.conf (/etc/environment), which resets PATH.
# JetBrains Toolbox shell scripts (idea, pycharm, webstorm...) on PATH for the whole desktop session:
# GUI apps such as Toolbox itself, and every terminal started from it. Takes effect at the next login.
PATH=${PATH}:${HOME}/.local/share/JetBrains/Toolbox/scripts
